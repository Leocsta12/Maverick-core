name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Espelha o setup local: --legacy-peer-deps por causa do conflito de
      # versão entre react/react-dom que o Expo puxa internamente (ver README).
      - name: Instalar dependências
        run: npm install --legacy-peer-deps

      - name: Typecheck
        run: npm run lint

      - name: Testes
        run: npm test -- --ci

  deno-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --node-modules-dir=none: sem isso o Deno tenta resolver os pacotes
      # npm transitivos do supabase-js contra o node_modules do projeto
      # Expo (que está aqui do lado, no mesmo repo) e falha — os dois
      # ecossistemas são independentes, ver README > Testes e CI.
      - name: Testes das Edge Functions (Deno)
        run: >
          deno test --allow-net --allow-env --node-modules-dir=none
          supabase/functions/_shared
          supabase/functions/strava-oauth-callback
          supabase/functions/strava-sync
          supabase/functions/strava-sync-all
          supabase/functions/generate-workout-plan
          supabase/functions/analyze-vision
