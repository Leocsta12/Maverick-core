name: Notificações Proativas

# Chama a Edge Function notify-athletes duas vezes por dia — 10:00 e
# 22:00 UTC (07:00 e 19:00 em Brasília), horários em que faz sentido
# receber um aviso de "prontidão baixa hoje" ou "sua prova está chegando"
# sem ser durante a madrugada. workflow_dispatch deixa rodar na mão
# também (útil pra testar).
on:
  schedule:
    - cron: '0 10,22 * * *'
  workflow_dispatch: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar notify-athletes
        run: |
          set -e
          response=$(curl -sS -w "\n%{http_code}" -X POST \
            "https://bexpclafvignpxvuxrlc.supabase.co/functions/v1/notify-athletes" \
            -H "x-cron-secret: ${{ secrets.STRAVA_CRON_SECRET }}" \
            -H "content-type: application/json")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Resposta: $body"
          if [ "$status" -ge 400 ]; then
            echo "notify-athletes retornou erro."
            exit 1
          fi
